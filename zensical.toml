[project]
site_name = "Radish"
site_description = "Daikin/ClimateTalk HVAC network tooling and ESPHome component docs."
site_url = "https://vesuvisian.com/radish/"
repo_url = "https://github.com/vesuvisian/radish"
repo_name = "vesuvisian/radish"

nav = [
  { Home = "index.md" },
  { Setup = [
    { "Hardware Setup" = "hardware.md" },
    { "Software Setup" = "software.md" },
    { "Wire and Verify" = "wire-and-verify.md" },
    { "Python Decoder" = "python-decoder.md" },
    { "ESPHome Component" = "esphome-component.md" },
  ] },
  { Reference = [
    { Glossary = "glossary.md" },
    { "Component Internals" = "component-internals.md" },
    { "Message Coverage Matrix" = "message_coverage_matrix.md" },
    { "Protocol Specification Archive" = "spec/README.md" },
  ] },
]

[project.theme]
variant = "classic"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "navigation.sections",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
]

[project.markdown_extensions]
admonition = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
toc.permalink = true
