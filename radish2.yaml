esphome:
  name: radish
  friendly_name: Radish

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      # type: git
      # url: https://github.com/vesuvisian/radish
      path: components

# Internal RGB LED configuration
light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO35
    num_leds: 1
    id: status_led
    name: "Atom S3 Status LED"
    chipset: WS2812
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
    name: "AtomS3 Button"
    on_press:
      then:
        - light.turn_on:
            id: status_led
            red: 100%
            green: 0%
            blue: 0%
            brightness: 60%
            transition_length: "0s"
    on_release:
      then:
        - light.turn_off:
            id: status_led
            transition_length: "0s"
              

# Configure the hardware UART for the Tail485
uart:
  id: rs485_bus
  tx_pin: GPIO2 # Stock Tail485: TX→DI, RX←RO
  rx_pin: GPIO1
  baud_rate: 9600

radish:
  uart_id: rs485_bus
  mqtt_topic: radish/rs485/raw
  app_query_mqtt_topic: radish/app_query
  publish_timeout_ms: 100ms
  max_frame_bytes: 256
  hex_delimiter: " "
  enable_raw_mqtt_forwarding: true
  local_node_type: 39
  autonet_enabled: false
  autonet_join_switch:
    name: "Radish AutoNet Join"
  # Optional fixed Slot Delay override (100ms..2500ms). When omitted, delay is
  # derived per CT-485: pseudorandom uniform in that range, seeded from device MAC.
  # slot_delay_ms: 250ms
  mac_from_device_identity: true
  # Optional override. Must be 8 bytes with 00:00:09 prefix.
  # local_mac_address: "00:00:09:12:34:56:78:9A"

# Enable MQTT
mqtt:
  broker: homeassistant.local # Change to your MQTT broker address if different
  username: !secret mqtt_user
  password: !secret mqtt_password

# Enable logging
logger:

# Enable Home Assistant API
api:
  custom_services: true
  encryption:
    key: "" # Generated key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Radish Fallback Hotspot"
    password: "" # Generated password

captive_portal:
    
